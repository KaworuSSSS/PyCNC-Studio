<title>PyCNC Studio — Virtual CNC</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #11151a;
        font-family: Arial, Helvetica, sans-serif;
    }

    #viewport {
        width: 100%;

    }

    canvas {
        display: block;
    }

    /* ==============================
       HUD
    ============================== */

    #hud {

        position: fixed;

        top: 20px;
        left: 20px;

        z-index: 20;

        min-width: 245px;

        padding: 18px 20px;

        color: white;

        background:
            rgba(10, 14, 18, 0.90);

        border:
            1px solid
            rgba(255, 255, 255, 0.12);

        border-radius: 12px;

        box-shadow:
            0 15px 40px
            rgba(0, 0, 0, 0.35);

        backdrop-filter:
            blur(10px);
    }

    .title {

        font-size: 21px;

        font-weight: 700;
    }

    .subtitle {

        margin-top: 4px;

        font-size: 10px;

        letter-spacing: 3px;

        opacity: 0.45;
    }

    .separator {

        height: 1px;

        margin: 14px 0;

        background:
            rgba(255, 255, 255, 0.10);
    }

    .coordinate {

        display: flex;

        justify-content: space-between;

        margin: 8px 0;

        font-size: 13px;
    }

    .axis {

        font-weight: 700;
    }

    .x {
        color: #e86b6b;
    }

    .y {
        color: #65d18a;
    }

    .z {

    }

    #status {

        font-size: 11px;

        letter-spacing: 2px;
    }

    .status-light {

        display: inline-block;

        width: 8px;
        height: 8px;

        margin-right: 8px;

        border-radius: 50%;

        background: #4bd17b;

        box-shadow:
            0 0 10px
            #4bd17b;
    }


    /* ==============================
       CONTROLS
    ============================== */

    #controls {

        position: fixed;

        top: 20px;
        right: 20px;

        z-index: 20;

        width: 215px;

        padding: 16px;

        color: #ddd;

        background:
            rgba(10, 14, 18, 0.90);

        border:
            1px solid
            rgba(255, 255, 255, 0.12);

        border-radius: 12px;

        font-size: 12px;

        box-shadow:
            0 15px 40px
            rgba(0, 0, 0, 0.25);
    }

    button {

        width: 100%;

        margin: 4px 0;

        padding: 9px;

        border: 0;

        border-radius: 6px;

        background: #343a40;

        color: white;

        cursor: pointer;
    }

    button:hover {

        background: #4a525a;
    }

    label {

        display: block;

        margin-top: 10px;

        margin-bottom: 5px;
    }

    input[type="range"] {

        width: 100%;
    }


    /* ==============================
       HELP
    ============================== */

    #help {

        position: fixed;

        right: 20px;
        bottom: 20px;

        z-index: 20;

        padding: 10px 14px;

        color:
            rgba(255, 255, 255, 0.55);

        background:
            rgba(10, 14, 18, 0.75);

        border-radius: 8px;

        font-size: 11px;

        line-height: 1.7;
    }

</style>

<!-- ==========================================
     THREE.JS
========================================== -->

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


import {
    OrbitControls
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


// ==================================================
// SCENE
// ==================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x11151a
    );


// ==================================================
// CAMERA
// ==================================================

const camera =
    new THREE.PerspectiveCamera(

        42,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

    );


camera.position.set(
    150,
    115,
    150
);


// ==================================================
// RENDERER
// ==================================================

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);


renderer.setSize(

    window.innerWidth,
    window.innerHeight

);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


document
    .getElementById("viewport")
    .appendChild(
        renderer.domElement
    );


// ==================================================
// CAMERA CONTROLS
// ==================================================

const controls =
    new OrbitControls(

        camera,

        renderer.domElement

    );


controls.target.set(
    0,
    35,
    0
);


controls.enableDamping =
    true;


controls.dampingFactor =
    0.06;


// ==================================================
// LIGHTING
// ==================================================

scene.add(

    new THREE.HemisphereLight(

        0xffffff,

        0x252525,

        2

    )

);


const keyLight =
    new THREE.DirectionalLight(

        0xffffff,

        3.5

    );


keyLight.position.set(
    100,
    180,
    120
);


keyLight.castShadow =
    true;


keyLight.shadow.mapSize.width =
    2048;


keyLight.shadow.mapSize.height =
    2048;


scene.add(
    keyLight
);


const fillLight =
    new THREE.DirectionalLight(

        0xb8c7ff,

        1.1

    );


fillLight.position.set(
    -120,
    80,
    -100
);


scene.add(
    fillLight
);


// ==================================================
// MATERIALS
// ==================================================

const aluminum =
    new THREE.MeshStandardMaterial({

        color: 0x737b82,

        metalness: 0.82,

        roughness: 0.27

    });


const aluminumDark =
    new THREE.MeshStandardMaterial({

        color: 0x454b50,

        metalness: 0.86,

        roughness: 0.25

    });


const blackMetal =
    new THREE.MeshStandardMaterial({

        color: 0x151719,

        metalness: 0.88,

        roughness: 0.22

    });


const rubber =
    new THREE.MeshStandardMaterial({

        color: 0x161819,

        roughness: 0.85

    });


const workpieceMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x9b6738,

        roughness: 0.72

    });


const steel =
    new THREE.MeshStandardMaterial({

        color: 0xa7adb2,

        metalness: 0.92,

        roughness: 0.18

    });


// ==================================================
// HELPERS
// ==================================================

function createBox(

    width,
    height,
    depth,
    material

) {

    const mesh =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                width,
                height,
                depth

            ),

            material

        );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    return mesh;

}


function createCylinder(

    radius,
    height,
    material

) {

    const mesh =

        new THREE.Mesh(

            new THREE.CylinderGeometry(

                radius,
                radius,
                height,
                32

            ),

            material

        );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    return mesh;

}


// ==================================================
// MACHINE
// ==================================================

const machine =
    new THREE.Group();


scene.add(
    machine
);


// ==================================================
// BASE
// ==================================================

const base =
    createBox(

        120,
        8,
        76,

        blackMetal

    );


base.position.y =
    4;


machine.add(
    base
);


// ==================================================
// BASE FRAME
// ==================================================

for (

    const x of [-52, 52]

) {

    for (

        const z of [-32, 32]

    ) {

        const profile =
            createBox(

                8,
                10,
                68,

                aluminum

            );


        profile.position.set(

            x,
            10,
            z

        );


        machine.add(
            profile
        );

    }

}


// ==================================================
// TABLE
// ==================================================

const table =
    createBox(

        104,
        5,
        62,

        aluminumDark

    );


table.position.y =
    17;


machine.add(
    table
);


// ==================================================
// T-SLOTS
// ==================================================

for (

    let x = -42;

    x <= 42;

    x += 14

) {

    const slot =
        createBox(

            2,
            0.8,
            55,

            blackMetal

        );


    slot.position.set(

        x,
        20,
        0

    );


    machine.add(
        slot
    );

}


// ==================================================
// WORKPIECE
// ==================================================

const workpiece =
    createBox(

        55,
        10,
        38,

        workpieceMaterial

    );


workpiece.position.y =
    25;


machine.add(
    workpiece
);


// ==================================================
// COLUMNS
// ==================================================

for (

    const x of [-52, 52]

) {

    const column =
        createBox(

            10,
            65,
            14,

            aluminum

        );


    column.position.set(

        x,
        50,
        0

    );


    machine.add(
        column
    );

}


// ==================================================
// GANTRY
// ==================================================

const gantry =
    new THREE.Group();


machine.add(
    gantry
);


const beam =
    createBox(

        105,
        14,
        15,

        aluminum

    );


beam.position.y =
    78;


gantry.add(
    beam
);


for (

    const x of [-48, 48]

) {

    const side =
        createBox(

            12,
            55,
            14,

            aluminum

        );


    side.position.set(

        x,
        52,
        0

    );


    gantry.add(
        side
    );

}


// ==================================================
// X RAILS
// ==================================================

for (

    const z of [-8, 8]

) {

    const rail =
        createCylinder(

            2,
            90,

            steel

        );


    rail.rotation.z =
        Math.PI / 2;


    rail.position.set(

        0,
        68,
        z

    );


    gantry.add(
        rail
    );

}


// ==================================================
// X CARRIAGE
// ==================================================

const carriage =
    new THREE.Group();


gantry.add(
    carriage
);


const carriageBody =
    createBox(

        24,
        28,
        25,

        blackMetal

    );


carriageBody.position.y =
    58;


carriage.add(
    carriageBody
);


// ==================================================
// Z AXIS
// ==================================================

const zAxis =
    new THREE.Group();


carriage.add(
    zAxis
);


// Z RAILS

const zRailLeft =
    createCylinder(

        2,
        42,

        steel

    );


zRailLeft.position.set(

    -7,
    38,
    0

);


zAxis.add(
    zRailLeft
);


const zRailRight =
    createCylinder(

        2,
        42,

        steel

    );


zRailRight.position.set(

    7,
    38,
    0

);


zAxis.add(
    zRailRight
);


// ==================================================
// SPINDLE
// ==================================================

const spindle =
    createCylinder(

        7,
        32,

        blackMetal

    );


spindle.position.y =
    37;


zAxis.add(
    spindle
);


// ==================================================
// SPINDLE NOSE
// ==================================================

const nose =
    createCylinder(

        4,
        8,

        steel

    );


nose.position.y =
    17;


zAxis.add(
    nose
);


// ==================================================
// TOOL
// ==================================================

const tool =
    createCylinder(

        1.3,
        16,

        steel

    );


tool.position.y =
    5;


zAxis.add(
    tool
);


// ==================================================
// TOOL PATH
// ==================================================

const pathPoints = [];


const pathGeometry =
    new THREE.BufferGeometry();


const pathMaterial =
    new THREE.LineBasicMaterial({

        color: 0xe84b4b,

        transparent: true,

        opacity: 0.9

    });


const pathLine =
    new THREE.Line(

        pathGeometry,

        pathMaterial

    );


scene.add(
    pathLine
);


// ==================================================
// GRID
// ==================================================

const grid =
    new THREE.GridHelper(

        220,
        22,

        0x555555,
        0x25282c

    );


grid.position.y =
    -1;


scene.add(
    grid
);


// ==================================================
// MACHINE STATE
// ==================================================

const state = {

    running: false,

    paused: false,

    stopped: false,

    time: 0,

    speed: 1

};


// ==================================================
// STATUS
// ==================================================

function setStatus(
    text
) {

    document
        .getElementById(
            "statusText"
        )
        .textContent =
        text;

}


// ==================================================
// HUD
// ==================================================

function updateHUD(

    x,
    y,
    z

) {

    document
        .getElementById("x")
        .textContent =
        x.toFixed(2);


    document
        .getElementById("y")
        .textContent =
        y.toFixed(2);


    document
        .getElementById("z")
        .textContent =
        z.toFixed(2);

}


// ==================================================
// TOOL PATH
// ==================================================

const toolWorldPosition =
    new THREE.Vector3();


function recordToolPosition() {

    zAxis.updateWorldMatrix(
        true,
        true
    );


    tool.getWorldPosition(

        toolWorldPosition

    );


    pathPoints.push(

        toolWorldPosition.clone()

    );


    if (

        pathPoints.length >
        2500

    ) {

        pathPoints.shift();

    }


    pathGeometry.setFromPoints(
        pathPoints
    );

}


// ==================================================
// MOTION
// ==================================================

function moveMachine(
    delta
) {

    if (

        !state.running ||
        state.paused ||
        state.stopped

    ) {

        return;

    }


    state.time +=

        delta *
        state.speed;


    const x =

        Math.sin(
            state.time
        ) *
        32;


    const y =

        Math.sin(
            state.time * 0.6
        ) *
        20;


    const z =

        2 +

        Math.sin(
            state.time * 1.3
        ) *
        4;


    carriage.position.x =
        x;


    gantry.position.z =
        y;


    zAxis.position.y =
        -z;


    updateHUD(
        x,
        y,
        z
    );


    recordToolPosition();


    if (

        state.time >
        Math.PI * 8

    ) {

        state.running =
            false;

        setStatus(
            "COMPLETED"
        );

    }

}


// ==================================================
// BUTTONS
// ==================================================

document
    .getElementById("start")
    .onclick = function () {

        state.running =
            true;

        state.paused =
            false;

        state.stopped =
            false;

        setStatus(
            "RUNNING"
        );

    };


document
    .getElementById("pause")
    .onclick = function () {

        if (
            state.running
        ) {

            state.paused =
                true;

            setStatus(
                "PAUSED"
            );

        }

    };


document
    .getElementById("stop")
    .onclick = function () {

        state.running =
            false;

        state.paused =
            false;

        state.stopped =
            true;

        setStatus(
            "STOPPED"
        );

    };


document
    .getElementById("home")
    .onclick = function () {

        state.running =
            false;

        state.paused =
            false;

        state.stopped =
            false;

        state.time =
            0;


        carriage.position.x =
            0;


        gantry.position.z =
            0;


        zAxis.position.y =
            0;


        pathPoints.length =
            0;


        pathGeometry.setFromPoints(
            []
        );


        updateHUD(
            0,
            0,
            0
        );


        setStatus(
            "READY"
        );

    };


document
    .getElementById("speed")
    .oninput = function () {

        state.speed =
            parseFloat(
                this.value
            );

    };


// ==================================================
// ANIMATION
// ==================================================

let previousTime =
    performance.now();


function animate(
    currentTime
) {

    requestAnimationFrame(
        animate
    );


    const delta =

        Math.min(

            (
                currentTime -
                previousTime
            ) / 1000,

            0.05

        );


    previousTime =
        currentTime;


    moveMachine(
        delta
    );


    controls.update();


    renderer.render(

        scene,
        camera

    );

}


animate(
    previousTime
);


// ==================================================
// RESIZE
// ==================================================

window.addEventListener(

    "resize",

    function () {

        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);

</script>

</body>
</html>
