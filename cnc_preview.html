<script type="module">

    /*
     * =====================================================
     * IMPORTS
     * =====================================================
     */

    import * as THREE
        from "three";


    import {
        OrbitControls
    }
        from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


    /*
     * =====================================================
     * ERROR HANDLING
     * =====================================================
     */

    function showError(error) {

        console.error(error);


        const panel =
            document.getElementById(
                "errorPanel"
            );


        const text =
            document.getElementById(
                "errorText"
            );


        panel.style.display =
            "block";


        text.textContent =
            String(
                error &&
                error.stack
                    ? error.stack
                    : error
            );

    }


    window.addEventListener(
        "error",
        event => {

            if (event.error) {

                showError(
                    event.error
                );

            }

        }
    );


    window.addEventListener(
        "unhandledrejection",
        event => {

            showError(
                event.reason
            );

        }
    );


    /*
     * =====================================================
     * SCENE
     * =====================================================
     */

    const scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x11151a
        );


    /*
     * =====================================================
     * CAMERA
     * =====================================================
     */

    const camera =
        new THREE.PerspectiveCamera(

            42,

            window.innerWidth /
            window.innerHeight,

            0.1,

            1000

        );


    camera.position.set(

        145,
        105,
        145

    );


    /*
     * =====================================================
     * RENDERER
     * =====================================================
     */

    const renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.shadowMap.enabled =
        true;


    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    document
        .getElementById(
            "viewport"
        )
        .appendChild(
            renderer.domElement
        );


    /*
     * =====================================================
     * CAMERA CONTROLS
     * =====================================================
     */

    const controls =
        new OrbitControls(

            camera,

            renderer.domElement

        );


    controls.target.set(

        0,
        35,
        0

    );


    controls.enableDamping =
        true;


    controls.dampingFactor =
        0.06;


    /*
     * =====================================================
     * LIGHTS
     * =====================================================
     */

    const ambient =
        new THREE.HemisphereLight(

            0xffffff,

            0x222222,

            2.2

        );


    scene.add(
        ambient
    );


    const mainLight =
        new THREE.DirectionalLight(

            0xffffff,

            3.5

        );


    mainLight.position.set(

        100,
        180,
        120

    );


    mainLight.castShadow =
        true;


    mainLight.shadow.mapSize.width =
        2048;


    mainLight.shadow.mapSize.height =
        2048;


    scene.add(
        mainLight
    );


    const secondaryLight =
        new THREE.DirectionalLight(

            0xb8c7ff,

            1.2

        );


    secondaryLight.position.set(

        -120,
        90,
        -100

    );


    scene.add(
        secondaryLight
    );


    /*
     * =====================================================
     * MATERIALS
     * =====================================================
     */

    const aluminum =
        new THREE.MeshStandardMaterial({

            color: 0x7c858c,

            metalness: 0.82,

            roughness: 0.27

        });


    const darkAluminum =
        new THREE.MeshStandardMaterial({

            color: 0x444b51,

            metalness: 0.85,

            roughness: 0.28

        });


    const blackMetal =
        new THREE.MeshStandardMaterial({

            color: 0x141618,

            metalness: 0.88,

            roughness: 0.22

        });


    const steel =
        new THREE.MeshStandardMaterial({

            color: 0xb3b8bd,

            metalness: 0.92,

            roughness: 0.18

        });


    const workpieceMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x9c693a,

            metalness: 0.05,

            roughness: 0.72

        });


    /*
     * =====================================================
     * HELPERS
     * =====================================================
     */

    function box(

        width,
        height,
        depth,
        material

    ) {

        const mesh =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    width,
                    height,
                    depth

                ),

                material

            );


        mesh.castShadow =
            true;


        mesh.receiveShadow =
            true;


        return mesh;

    }


    function cylinder(

        radius,
        height,
        material

    ) {

        const mesh =
            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    radius,
                    radius,
                    height,
                    32

                ),

                material

            );


        mesh.castShadow =
            true;


        mesh.receiveShadow =
            true;


        return mesh;

    }


    /*
     * =====================================================
     * CNC MACHINE
     * =====================================================
     */

    const machine =
        new THREE.Group();


    scene.add(
        machine
    );


    /*
     * BASE
     */

    const base =
        box(

            120,
            8,
            76,

            blackMetal

        );


    base.position.y =
        4;


    machine.add(
        base
    );


    /*
     * BASE SIDE PROFILES
     */

    for (
        const x of [-52, 52]
    ) {

        const profile =
            box(

                8,
                10,
                68,

                aluminum

            );


        profile.position.set(

            x,
            10,
            0

        );


        machine.add(
            profile
        );

    }


    /*
     * TABLE
     */

    const table =
        box(

            104,
            5,
            62,

            darkAluminum

        );


    table.position.y =
        17;


    machine.add(
        table
    );


    /*
     * T-SLOTS
     */

    for (

        let x = -42;

        x <= 42;

        x += 14

    ) {

        const slot =
            box(

                2,
                0.8,
                55,

                blackMetal

            );


        slot.position.set(

            x,
            20,
            0

        );


        machine.add(
            slot
        );

    }


    /*
     * WORKPIECE
     */

    const workpiece =
        box(

            55,
            10,
            38,

            workpieceMaterial

        );


    workpiece.position.y =
        25;


    machine.add(
        workpiece
    );


    /*
     * COLUMNS
     */

    for (
        const x of [-52, 52]
    ) {

        const column =
            box(

                10,
                65,
                14,

                aluminum

            );


        column.position.set(

            x,
            50,
            0

        );


        machine.add(
            column
        );

    }


    /*
     * =====================================================
     * GANTRY
     * =====================================================
     */

    const gantry =
        new THREE.Group();


    machine.add(
        gantry
    );


    const beam =
        box(

            105,
            14,
            15,

            aluminum

        );


    beam.position.y =
        78;


    gantry.add(
        beam
    );


    /*
     * GANTRY SIDES
     */

    for (
        const x of [-48, 48]
    ) {

        const side =
            box(

                12,
                55,
                14,

                aluminum

            );


        side.position.set(

            x,
            52,
            0

        );


        gantry.add(
            side
        );

    }


    /*
     * =====================================================
     * X RAILS
     * =====================================================
     */

    for (
        const z of [-8, 8]
    ) {

        const rail =
            cylinder(

                2,
                90,

                steel

            );


        rail.rotation.z =
            Math.PI / 2;


        rail.position.set(

            0,
            68,
            z

        );


        gantry.add(
            rail
        );

    }


    /*
     * =====================================================
     * X CARRIAGE
     * =====================================================
     */

    const carriage =
        new THREE.Group();


    gantry.add(
        carriage
    );


    const carriageBody =
        box(

            24,
            28,
            25,

            blackMetal

        );


    carriageBody.position.y =
        58;


    carriage.add(
        carriageBody
    );


    /*
     * =====================================================
     * Z AXIS
     * =====================================================
     */

    const zAxis =
        new THREE.Group();


    carriage.add(
        zAxis
    );


    /*
     * Z RAILS
     */

    const zRailLeft =
        cylinder(

            2,
            42,

            steel

        );


    zRailLeft.position.set(

        -7,
        38,
        0

    );


    zAxis.add(
        zRailLeft
    );


    const zRailRight =
        cylinder(

            2,
            42,

            steel

        );


    zRailRight.position.set(

        7,
        38,
        0

    );


    zAxis.add(
        zRailRight
    );


    /*
     * =====================================================
     * SPINDLE
     * =====================================================
     */

    const spindle =
        cylinder(

            7,
            32,

            blackMetal

        );


    spindle.position.y =
        37;


    zAxis.add(
        spindle
    );


    /*
     * SPINDLE NOSE
     */

    const nose =
        cylinder(

            4,
            8,

            steel

        );


    nose.position.y =
        17;


    zAxis.add(
        nose
    );


    /*
     * TOOL
     */

    const tool =
        cylinder(

            1.3,
            16,

            steel

        );


    tool.position.y =
        5;


    zAxis.add(
        tool
    );


    /*
     * =====================================================
     * TOOL PATH
     * =====================================================
     */

    const pathPoints = [];


    const pathGeometry =
        new THREE.BufferGeometry();


    const pathMaterial =
        new THREE.LineBasicMaterial({

            color: 0xe84b4b,

            transparent: true,

            opacity: 0.95

        });


    const pathLine =
        new THREE.Line(

            pathGeometry,

            pathMaterial

        );


    scene.add(
        pathLine
    );


    /*
     * =====================================================
     * FLOOR GRID
     * =====================================================
     */

    const grid =
        new THREE.GridHelper(

            220,
            22,

            0x555555,

            0x25282c

        );


    grid.position.y =
        -1;


    scene.add(
        grid
    );


    /*
     * =====================================================
     * MACHINE STATE
     * =====================================================
     */

    const state = {

        running: false,

        paused: false,

        stopped: false,

        time: 0,

        speed: 1

    };


    /*
     * =====================================================
     * STATUS
     * =====================================================
     */

    function setStatus(
        text
    ) {

        document
            .getElementById(
                "statusText"
            )
            .textContent =
            text;

    }


    /*
     * =====================================================
     * HUD
     * =====================================================
     */

    function updateHUD(

        x,
        y,
        z

    ) {

        document
            .getElementById(
                "x"
            )
            .textContent =
            x.toFixed(2);


        document
            .getElementById(
                "y"
            )
            .textContent =
            y.toFixed(2);


        document
            .getElementById(
                "z"
            )
            .textContent =
            z.toFixed(2);

    }


    /*
     * =====================================================
     * TOOL POSITION
     * =====================================================
     */

    const toolWorldPosition =
        new THREE.Vector3();


    function recordToolPosition() {

        zAxis.updateWorldMatrix(

            true,
            true

        );


        tool.getWorldPosition(

            toolWorldPosition

        );


        pathPoints.push(

            toolWorldPosition.clone()

        );


        if (
            pathPoints.length > 2500
        ) {

            pathPoints.shift();

        }


        pathGeometry.setFromPoints(

            pathPoints

        );

    }


    /*
     * =====================================================
     * MOTION
     * =====================================================
     */

    function moveMachine(
        delta
    ) {

        if (

            !state.running ||
            state.paused ||
            state.stopped

        ) {

            return;

        }


        state.time +=

            delta *
            state.speed;


        /*
         * X MOVEMENT
         */

        const x =

            Math.sin(
                state.time
            ) *
            32;


        /*
         * Y MOVEMENT
         */

        const y =

            Math.sin(
                state.time * 0.6
            ) *
            20;


        /*
         * Z MOVEMENT
         */

        const z =

            2 +

            Math.sin(
                state.time * 1.3
            ) *
            4;


        carriage.position.x =
            x;


        gantry.position.z =
            y;


        zAxis.position.y =
            -z;


        updateHUD(

            x,
            y,
            z

        );


        recordToolPosition();


        /*
         * DEMO COMPLETED
         */

        if (

            state.time >
            Math.PI * 8

        ) {

            state.running =
                false;


            setStatus(
                "COMPLETED"
            );

        }

    }


    /*
     * =====================================================
     * START
     * =====================================================
     */

    document
        .getElementById(
            "start"
        )
        .addEventListener(

            "click",

            function () {

                state.running =
                    true;


                state.paused =
                    false;


                state.stopped =
                    false;


                setStatus(
                    "RUNNING"
                );

            }

        );


    /*
     * =====================================================
     * PAUSE
     * =====================================================
     */

    document
        .getElementById(
            "pause"
        )
        .addEventListener(

            "click",

            function () {

                if (
                    state.running
                ) {

                    state.paused =
                        true;


                    setStatus(
                        "PAUSED"
                    );

                }

            }

        );


    /*
     * =====================================================
     * STOP
     * =====================================================
     */

    document
        .getElementById(
            "stop"
        )
        .addEventListener(

            "click",

            function () {

                state.running =
                    false;


                state.paused =
                    false;


                state.stopped =
                    true;


                setStatus(
                    "STOPPED"
                );

            }

        );


    /*
     * =====================================================
     * HOME
     * =====================================================
     */

    document
        .getElementById(
            "home"
        )
        .addEventListener(

            "click",

            function () {

                state.running =
                    false;


                state.paused =
                    false;


                state.stopped =
                    false;


                state.time =
                    0;


                carriage.position.x =
                    0;


                gantry.position.z =
                    0;


                zAxis.position.y =
                    0;


                pathPoints.length =
                    0;


                pathGeometry.setFromPoints(
                    []
                );


                updateHUD(

                    0,
                    0,
                    0

                );


                setStatus(
                    "READY"
                );

            }

        );


    /*
     * =====================================================
     * SPEED
     * =====================================================
     */

    document
        .getElementById(
            "speed"
        )
        .addEventListener(

            "input",

            function () {

                state.speed =
                    parseFloat(
                        this.value
                    );

            }

        );


    /*
     * =====================================================
     * ANIMATION
     * =====================================================
     */

    let previousTime =
        performance.now();


    function animate(
        currentTime
    ) {

        requestAnimationFrame(
            animate
        );


        const delta =

            Math.min(

                (
                    currentTime -
                    previousTime
                ) / 1000,

                0.05

            );


        previousTime =
            currentTime;


        moveMachine(
            delta
        );


        controls.update();


        renderer.render(

            scene,
            camera

        );

    }


    /*
     * =====================================================
     * START ANIMATION
     * =====================================================
     */

    animate(
        previousTime
    );


    /*
     * =====================================================
     * WINDOW RESIZE
     * =====================================================
     */

    window.addEventListener(

        "resize",

        function () {

            camera.aspect =

                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }

    );


    /*
     * =====================================================
     * INITIAL STATE
     * =====================================================
     */

    updateHUD(

        0,
        0,
        0

    );


    setStatus(
        "READY"
    );


    console.log(
        "PyCNC Studio — Three.js initialized"
    );

</script>
