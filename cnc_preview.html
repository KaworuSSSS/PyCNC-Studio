<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">

<title>PyCNC Studio — Virtual CNC</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0e11;
    font-family: Arial, Helvetica, sans-serif;
}

#viewport {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

/* ---------------- HUD ---------------- */

#hud {
    position: fixed;
    z-index: 20;
    top: 18px;
    left: 18px;

    width: 250px;
    padding: 18px;

    color: #e9edf0;

    background: rgba(12, 16, 20, 0.90);

    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;

    box-shadow:
        0 18px 50px rgba(0,0,0,0.45);

    backdrop-filter: blur(12px);
}

.title {
    font-size: 21px;
    font-weight: bold;
}

.subtitle {
    margin-top: 4px;

    color: #89939a;

    font-size: 9px;
    letter-spacing: 3px;
}

.separator {
    height: 1px;

    margin: 14px 0;

    background: rgba(255,255,255,0.10);
}

.coordinate {
    display: flex;
    justify-content: space-between;

    margin: 9px 0;

    font-size: 13px;
}

.axis-x {
    color: #ef6666;
    font-weight: bold;
}

.axis-y {
    color: #62d48a;
    font-weight: bold;
}

.axis-z {
    color: #70a8ef;
    font-weight: bold;
}

.status {
    font-size: 10px;
    letter-spacing: 2px;
}

.status-dot {
    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #45d27a;

    box-shadow: 0 0 10px #45d27a;
}

/* ---------------- CONTROLS ---------------- */

#controls {
    position: fixed;
    z-index: 20;

    top: 18px;
    right: 18px;

    width: 210px;

    padding: 14px;

    color: white;

    background: rgba(12,16,20,0.90);

    border: 1px solid rgba(255,255,255,0.12);

    border-radius: 12px;

    backdrop-filter: blur(12px);
}

button {
    width: 100%;

    margin: 3px 0;

    padding: 10px;

    border: none;

    border-radius: 6px;

    background: #30373d;

    color: #f3f5f6;

    cursor: pointer;
}

button:hover {
    background: #454e55;
}

button:active {
    transform: translateY(1px);
}

label {
    display: block;

    margin-top: 12px;
    margin-bottom: 5px;

    color: #aab2b8;

    font-size: 11px;
}

input[type="range"] {
    width: 100%;
}

/* ---------------- HELP ---------------- */

#help {
    position: fixed;

    right: 18px;
    bottom: 16px;

    z-index: 20;

    padding: 9px 12px;

    color: #8e979d;

    background: rgba(10,13,16,0.75);

    border-radius: 8px;

    font-size: 10px;

    line-height: 1.6;
}

/* ---------------- ERROR ---------------- */

#error {
    display: none;

    position: fixed;

    z-index: 100;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: min(720px, 90vw);

    padding: 22px;

    color: white;

    background: #291519;

    border: 1px solid #87414c;

    border-radius: 12px;
}

#error pre {
    white-space: pre-wrap;

    font-size: 12px;
}
</style>

</head>

<script type="module">

import * as THREE
    from "three";

import { OrbitControls }
    from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* =========================================================
   ERROR HANDLING
   ========================================================= */

function showError(error) {

    console.error(error);

    document
        .getElementById("error")
        .style.display = "block";

    document
        .getElementById("errorText")
        .textContent =
        String(error?.stack || error);

}

window.addEventListener(
    "error",
    event => {

        if (event.error) {

            showError(event.error);

        }

    }
);

window.addEventListener(
    "unhandledrejection",
    event => {

        showError(event.reason);

    }
);


/* =========================================================
   SCENE
   ========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x101419);

scene.fog =
    new THREE.Fog(
        0x101419,

   CAMERA
   ========================================================= */

function material(

    metalness = 0.5,
    roughness = 0.3
) {

        metalness,

        roughness

/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */

function box(
    width,
    height,
    depth,
    material
) {

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );

    mesh.castShadow = true;

    mesh.receiveShadow = true;

    return mesh;

}


function cylinder(
    radius,
    height,
    material,
    segments = 32
) {

    const mesh =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                radius,
                radius,
                height,
                segments
            ),
            material
        );

    mesh.castShadow = true;

    mesh.receiveShadow = true;

    return mesh;

}


function addBox(
    parent,
    width,
    height,
    depth,
    material,
    x,
    y,
    z
) {

    const object =
        box(
            width,
            height,
            depth,
            material
        );

    object.position.set(
        x,
        y,
        z
    );

    parent.add(object);

    return object;

}


function addCylinder(
    parent,
    radius,
    height,
    material,
    x,
    y,
    z
) {

    const object =
        cylinder(
            radius,
            height,
            material
        );

    object.position.set(
        x,
        y,
        z
    );

    parent.add(object);

    return object;

}


/* =========================================================
   CNC ROOT
   ========================================================= */

    new THREE.Group();

scene.add(cnc);

addBox(

    88,

addBox(

/* =========================================================

for (

for (

addBox(

addBox(

);


addBox(

    3,
    7,
    34,

);


addBox(
    cnc,
    3,
    7,
    34,

    26.5,
    39,
    0
);


/* =========================================================
   MACHINE COLUMNS
   ========================================================= */

for (
    const x of [-54, 54]
) {

    addBox(
        cnc,

        18,

addBox(

cnc.add(gantry);


addBox(

    gantry,

/* =========================================================
   X LINEAR RAILS
   ========================================================= */

for (
    const z of [-9, 9]

    const rail =
        cylinder(

        );

   X CARRIAGE
   ========================================================= */

const carriage =

gantry.add(carriage);


addBox(
    carriage,
    28,
    25,
    30,
    darkFrame,
    0,
    70,

);


addBox(
    carriage,
    22,
    18,
    32,
    frame,

    57,
    0

   Z AXIS

carriage.add(zAxis);

/* =========================================================
   FLOOR
   ========================================================= */

const floor =
    new THREE.Mesh(

        material(

        )

   FLOOR GRID

/* =========================================================
   TOOLPATH
   ========================================================= */

const toolPathPoints = [];

const pathGeometry =
    new THREE.BufferGeometry();

const pathMaterial =
    new THREE.LineBasicMaterial({
        color: 0xff4545,
        transparent: true,
        opacity: 0.9
    });

const toolPath =
    new THREE.Line(
        pathGeometry,
        pathMaterial
    );

scene.add(toolPath);


/* =========================================================
   SIMULATION STATE
   ========================================================= */

const state = {

    running: false,

    paused: false,

    stopped: false,

    time: 0,

    speed: 1

};


/* =========================================================
   HUD
   ========================================================= */

function updateHUD(
    x,
    y,
    z
) {

    document
        .getElementById("x")
        .textContent =
        x.toFixed(2);

    document
        .getElementById("y")
        .textContent =
        y.toFixed(2);

    document
        .getElementById("z")
        .textContent =
        z.toFixed(2);

}


function setStatus(
    text
) {

    document
        .getElementById("statusText")
        .textContent =
        text;

}


/* =========================================================
   RECORD TOOLPATH
   ========================================================= */

const worldToolPosition =
    new THREE.Vector3();


function recordToolPath() {

    toolTip.getWorldPosition(
        worldToolPosition
    );

    toolPathPoints.push(
        worldToolPosition.clone()
    );

    if (
        toolPathPoints.length > 1500
    ) {

        toolPathPoints.shift();

    }

    pathGeometry.setFromPoints(
        toolPathPoints
    );

}


/* =========================================================
   SIMULATION
   ========================================================= */

function simulate(
    delta
) {

    if (
        !state.running ||
        state.paused ||
        state.stopped
    ) {

        return;

    }


    state.time +=
        delta *
        state.speed;


    /*
       X movement
    */

    const x =
        Math.sin(
            state.time * 0.8
        ) * 34;


    /*
       Y movement
    */

    const y =
        Math.sin(
            state.time * 0.48
        ) * 18;


    /*
       Z movement
    */

    const z =
        5 +
        Math.max(
            0,
            Math.sin(
                state.time * 1.15
            )
        ) * 8;


    /*
       Move X carriage
    */

    carriage.position.x =
        x;


    /*
       Move entire gantry along Y
    */

    gantry.position.z =
        y;


    /*
       Move spindle along Z
    */

    zAxis.position.y =
        -z;


    /*
       Rotate spindle
    */

    spindle.rotation.y +=
        0.35 *
        state.speed;


    updateHUD(
        x,
        y,
        z
    );


    recordToolPath();


    /*
       End demonstration
    */

    if (
        state.time >
        Math.PI * 10
    ) {

        state.running = false;

        setStatus(
            "COMPLETED"
        );

    }

}


/* =========================================================
   BUTTONS
   ========================================================= */

document
    .getElementById("start")
    .onclick = () => {

        state.running = true;

        state.paused = false;

        state.stopped = false;

        setStatus(
            "RUNNING"
        );

    };


document
    .getElementById("pause")
    .onclick = () => {

        if (
            state.running
        ) {

            state.paused = true;

            setStatus(
                "PAUSED"
            );

        }

    };


document
    .getElementById("stop")
    .onclick = () => {

        state.running = false;

        state.paused = false;

        state.stopped = true;

        setStatus(
            "STOPPED"
        );

    };


document
    .getElementById("home")
    .onclick = () => {

        state.running = false;

        state.paused = false;

        state.stopped = false;

        state.time = 0;

        carriage.position.x = 0;

        gantry.position.z = 0;

        zAxis.position.y = 0;

        spindle.rotation.y = 0;

        toolPathPoints.length = 0;

        pathGeometry.setFromPoints(
            []
        );

        updateHUD(
            0,
            0,
            0
        );

        setStatus(
            "READY"
        );

    };


document
    .getElementById("speed")
    .oninput = event => {

        state.speed =
            parseFloat(
                event.target.value
            );

    };


/* =========================================================
   ANIMATION
   ========================================================= */

let previousTime =
    performance.now();


function animate(
    currentTime
) {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            (currentTime - previousTime) /
            1000,
            0.05
        );


    previousTime =
        currentTime;


    simulate(
        delta
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate(
    previousTime
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   INITIAL STATE
   ========================================================= */

updateHUD(
    0,
    0,
    0
);

setStatus(
    "READY"
);


console.log(
    "PyCNC Studio — Virtual CNC v0.2 initialized"
);

</script>

</body>
</html>
