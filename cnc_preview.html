<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PyCNC Studio — Virtual CNC</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #090c0f;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#viewport {

    position: fixed;

    inset: 0;
}

canvas {

    display: block;
}


/* =========================================================
   HUD
   ========================================================= */

#hud {

    position: fixed;

    z-index: 20;

    top: 18px;
    left: 18px;

    width: 255px;

    padding: 18px;

    color: #e9edf0;

    background:
        rgba(10, 14, 18, 0.90);

    border:
        1px solid
        rgba(255,255,255,0.12);

    border-radius: 12px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.45);

    backdrop-filter:
        blur(14px);
}

.title {

    font-size: 22px;

    font-weight: 700;

    letter-spacing: 0.5px;
}

.subtitle {

    margin-top: 4px;

    color: #7e8991;

    font-size: 9px;

    letter-spacing: 3px;
}

.separator {

    height: 1px;

    margin: 15px 0;

    background:
        rgba(255,255,255,0.09);
}

.coordinate {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin: 10px 0;

    font-size: 13px;
}

.axis-x {

    color: #ef6666;

    font-weight: bold;
}

.axis-y {

    color: #62d48a;

    font-weight: bold;
}

.axis-z {

    color: #70a8ef;

    font-weight: bold;
}

.coordinate b {

    font-size: 14px;

    font-family:
        "Consolas",
        monospace;
}

.status {

    font-size: 10px;

    letter-spacing: 2px;
}

.status-dot {

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #45d27a;

    box-shadow:
        0 0 10px #45d27a;
}


/* =========================================================
   CONTROLS
   ========================================================= */

#controls {

    position: fixed;

    z-index: 20;

    top: 18px;
    right: 18px;

    width: 215px;

    padding: 15px;

    color: white;

    background:
        rgba(10,14,18,0.90);

    border:
        1px solid
        rgba(255,255,255,0.12);

    border-radius: 12px;

    backdrop-filter:
        blur(14px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.40);
}

.control-title {

    margin-bottom: 10px;

    color: #7e8991;

    font-size: 9px;

    letter-spacing: 2px;
}

button {

    width: 100%;

    margin: 3px 0;

    padding: 10px;

    border: 0;

    border-radius: 6px;

    background:
        #252c31;

    color: #e8ecef;

    cursor: pointer;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 0.5px;

    transition:
        background 0.15s,
        transform 0.1s;
}

button:hover {

    background: #343d43;
}

button:active {

    transform:
        translateY(1px);
}

#start:hover {

    background: #245e3b;
}

#stop:hover {

    background: #712b31;
}

label {

    display: block;

    margin-top: 13px;
    margin-bottom: 6px;

    color: #8e989f;

    font-size: 10px;

    letter-spacing: 1px;
}

input[type="range"] {

    width: 100%;

    accent-color: #d1a82b;
}


/* =========================================================
   HELP
   ========================================================= */

#help {

    position: fixed;

    right: 18px;
    bottom: 16px;

    z-index: 20;

    padding:
        8px 12px;

    color: #737e85;

    background:
        rgba(8,11,14,0.78);

    border-radius: 7px;

    font-size: 10px;

    line-height: 1.6;
}


/* =========================================================
   ERROR
   ========================================================= */

#error {

    display: none;

    position: fixed;

    z-index: 100;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    width:
        min(720px, 90vw);

    padding: 22px;

    color: white;

    background: #291519;

    border:
        1px solid #87414c;

    border-radius: 12px;
}

#error h3 {

    margin-top: 0;
}

#error pre {

    white-space: pre-wrap;

    font-size: 12px;
}

</style>
</head>


<body>


<div id="viewport"></div>


<!-- =========================================================
     HUD
     ========================================================= -->

<div id="hud">

    <div class="title">
        PyCNC Studio
    </div>

    <div class="subtitle">
        VIRTUAL CNC • MILLING MACHINE
    </div>

    <div class="separator"></div>

    <div class="coordinate">

        <span class="axis-x">
            X
        </span>

        <span>
            <b id="x">0.00</b> mm
        </span>

    </div>


    <div class="coordinate">

        <span class="axis-y">
            Y
        </span>

        <span>
            <b id="y">0.00</b> mm
        </span>

    </div>


    <div class="coordinate">

        <span class="axis-z">
            Z
        </span>

        <span>
            <b id="z">0.00</b> mm
        </span>

    </div>


    <div class="separator"></div>


    <div class="status">

        <span class="status-dot"></span>

        <span id="statusText">
            READY
        </span>

    </div>

</div>


<!-- =========================================================
     CONTROLS
     ========================================================= -->

<div id="controls">

    <div class="control-title">
        MACHINE CONTROL
    </div>

    <button id="start">
        ▶ START
    </button>

    <button id="pause">
        Ⅱ PAUSE
    </button>

    <button id="stop">
        ■ STOP
    </button>

    <button id="home">
        ⌂ HOME
    </button>

    <label>
        VELOCIDAD
    </label>

    <input
        id="speed"
        type="range"
        min="0.2"
        max="3"
        step="0.1"
        value="1"
    >

</div>


<!-- =========================================================
     HELP
     ========================================================= -->

<div id="help">

    Arrastra: rotar<br>

    Rueda: zoom<br>

    Botón derecho: desplazar

</div>


<!-- =========================================================
     ERROR
     ========================================================= -->

<div id="error">

    <h3>
        Error 3D
    </h3>

    <pre id="errorText"></pre>

</div>


<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"

    }
}

</script>


<script type="module">

import * as THREE
    from "three";

import {
    OrbitControls
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* =========================================================
   ERROR HANDLING
   ========================================================= */

function showError(error) {

    console.error(error);

    document
        .getElementById("error")
        .style.display = "block";

    document
        .getElementById("errorText")
        .textContent =
        String(
            error?.stack || error
        );

}

window.addEventListener(
    "error",
    event => {

        if (event.error) {

            showError(
                event.error
            );

        }

    }
);

window.addEventListener(
    "unhandledrejection",
    event => {

        showError(
            event.reason
        );

    }
);


/* =========================================================
   SCENE
   ========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x0d1115
    );

scene.fog =
    new THREE.Fog(
        0x0d1115,
        260,
        600
    );


/* =========================================================
   CAMERA
   ========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        40,
        innerWidth / innerHeight,
        0.1,
        1000
    );

camera.position.set(
    175,
    130,
    190
);


/* =========================================================
   RENDERER
   ========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("viewport")
    .appendChild(
        renderer.domElement
    );


/* =========================================================
   CAMERA CONTROLS
   ========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.target.set(
    0,
    55,
    0
);

controls.enableDamping =
    true;

controls.dampingFactor =
    0.055;

controls.minDistance =
    75;

controls.maxDistance =
    380;


/* =========================================================
   LIGHTING
   ========================================================= */

scene.add(

    new THREE.HemisphereLight(
        0xe8eef2,
        0x161b20,
        2.1
    )

);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        3.5
    );

keyLight.position.set(
    150,
    230,
    160
);

keyLight.castShadow =
    true;

keyLight.shadow.mapSize.set(
    2048,
    2048
);

scene.add(
    keyLight
);


const fillLight =
    new THREE.DirectionalLight(
        0x8ca9c7,
        1.1
    );

fillLight.position.set(
    -160,
    110,
    -150
);

scene.add(
    fillLight
);


const workLight =
    new THREE.PointLight(
        0xffd99c,
        35,
        150
    );

workLight.position.set(
    0,
    90,
    20
);

scene.add(
    workLight
);


/* =========================================================
   MATERIALS
   ========================================================= */

function material(
    color,
    metalness = 0.5,
    roughness = 0.3
) {

    return new THREE.MeshStandardMaterial({

        color,

        metalness,

        roughness

    });

}


const aluminum =
    material(
        0x4d555a,
        0.85,
        0.28
    );


const aluminumDark =
    material(
        0x252b2f,
        0.90,
        0.22
    );


const aluminumLight =
    material(
        0x899297,
        0.90,
        0.20
    );


const black =
    material(
        0x101315,
        0.88,
        0.20
    );


const steel =
    material(
        0xb3bbc0,
        0.94,
        0.15
    );


const rubber =
    material(
        0x0c0e10,
        0.15,
        0.78
    );


const yellow =
    material(
        0xd5a72a,
        0.55,
        0.30
    );


const red =
    material(
        0xc9343a,
        0.45,
        0.28
    );


const workMaterial =
    material(
        0x8a5530,
        0.10,
        0.65
    );


/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */

function box(
    width,
    height,
    depth,
    mat
) {

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            mat

        );

    mesh.castShadow =
        true;

    mesh.receiveShadow =
        true;

    return mesh;

}


function cylinder(
    radius,
    height,
    mat,
    segments = 32
) {

    const mesh =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                radius,
                radius,
                height,
                segments
            ),

            mat

        );

    mesh.castShadow =
        true;

    mesh.receiveShadow =
        true;

    return mesh;

}


function addBox(
    parent,
    width,
    height,
    depth,
    mat,
    x,
    y,
    z
) {

    const object =
        box(
            width,
            height,
            depth,
            mat
        );

    object.position.set(
        x,
        y,
        z
    );

    parent.add(
        object
    );

    return object;

}


function addCylinder(
    parent,
    radius,
    height,
    mat,
    x,
    y,
    z
) {

    const object =
        cylinder(
            radius,
            height,
            mat
        );

    object.position.set(
        x,
        y,
        z
    );

    parent.add(
        object
    );

    return object;

}


/* =========================================================
   CNC ROOT
   ========================================================= */

const cnc =
    new THREE.Group();

scene.add(
    cnc
);


/* =========================================================
   MACHINE DIMENSIONS

   X = izquierda / derecha
   Y = altura
   Z = profundidad

   Movimiento:
   X -> carriage
   Y -> gantry
   Z -> spindle
   ========================================================= */

const MACHINE_X = 150;
const MACHINE_Z = 100;


/* =========================================================
   BASE
   ========================================================= */

addBox(
    cnc,
    158,
    8,
    108,
    aluminumDark,
    0,
    4,
    0
);


addBox(
    cnc,
    148,
    12,
    98,
    aluminum,
    0,
    12,
    0
);


addBox(
    cnc,
    136,
    5,
    86,
    black,
    0,
    20,
    0
);


/* =========================================================
   MACHINE FEET
   ========================================================= */

for (
    const x of [-64, 64]
) {

    for (
        const z of [-40, 40]
    ) {

        addBox(
            cnc,
            20,
            12,
            20,
            rubber,
            x,
            -2,
            z
        );

    }

}


/* =========================================================
   T-SLOT BED
   ========================================================= */

addBox(
    cnc,
    124,
    7,
    72,
    aluminumLight,
    0,
    25,
    0
);


for (
    let x = -55;
    x <= 55;
    x += 11
) {

    addBox(
        cnc,
        2,
        1,
        68,
        black,
        x,
        29,
        0
    );

}


for (
    let z = -30;
    z <= 30;
    z += 12
) {

    addBox(
        cnc,
        122,
        1,
        1.4,
        black,
        0,
        29.1,
        z
    );

}


/* =========================================================
   WORKPIECE
   ========================================================= */

const workpiece =
    addBox(
        cnc,
        58,
        10,
        34,
        workMaterial,
        0,
        34,
        0
    );


/* =========================================================
   VISE
   ========================================================= */

addBox(
    cnc,
    70,
    5,
    44,
    aluminumDark,
    0,
    31,
    0
);


addBox(
    cnc,
    5,
    15,
    42,
    steel,
    -32,
    39,
    0
);


addBox(
    cnc,
    5,
    15,
    42,
    steel,
    32,
    39,
    0
);


addBox(
    cnc,
    3,
    8,
    34,
    aluminumLight,
    -28,
    43,
    0
);


addBox(
    cnc,
    3,
    8,
    34,
    aluminumLight,
    28,
    43,
    0
);


/* =========================================================
   VERTICAL FRAME

   Estilo parecido a la máquina de referencia:
   estructura robusta de perfiles.
   ========================================================= */

for (
    const x of [-66, 66]
) {

    for (
        const z of [-42, 42]
    ) {

        addBox(
            cnc,
            14,
            75,
            14,
            aluminum,
            x,
            62,
            z
        );


        addBox(
            cnc,
            8,
            66,
            18,
            aluminumDark,
            x,
            62,
            z + 5
        );

    }

}


/* =========================================================
   UPPER FRAME
   ========================================================= */

addBox(
    cnc,
    145,
    12,
    14,
    aluminumDark,
    0,
    100,
    -42
);


addBox(
    cnc,
    145,
    12,
    14,
    aluminumDark,
    0,
    100,
    42
);


addBox(
    cnc,
    14,
    12,
    84,
    aluminumDark,
    -66,
    100,
    0
);


addBox(
    cnc,
    14,
    12,
    84,
    aluminumDark,
    66,
    100,
    0
);


/* =========================================================
   GANTRY

   Esta pieza se moverá en Z.
   ========================================================= */

const gantry =
    new THREE.Group();

cnc.add(
    gantry
);


/* GANTRY FRONT BEAM */

addBox(
    gantry,
    138,
    18,
    18,
    aluminum,
    0,
    92,
    -32
);


addBox(
    gantry,
    130,
    7,
    22,
    aluminumDark,
    0,
    82,
    -32
);


/* GANTRY SIDE PLATES */

addBox(
    gantry,
    14,
    35,
    22,
    aluminumDark,
    -61,
    72,
    -32
);


addBox(
    gantry,
    14,
    35,
    22,
    aluminumDark,
    61,
    72,
    -32
);


/* =========================================================
   Y RAILS
   ========================================================= */

for (
    const x of [-52, 52]
) {

    const rail =
        cylinder(
            2.8,
            122,
            steel
        );

    rail.rotation.x =
        Math.PI / 2;

    rail.position.set(
        x,
        85,
        0
    );

    cnc.add(
        rail
    );

}


/* =========================================================
   Y BALL SCREW
   ========================================================= */

const yScrew =
    cylinder(
        2.2,
        105,
        steel
    );

yScrew.rotation.x =
    Math.PI / 2;

yScrew.position.set(
    0,
    75,
    0
);

cnc.add(
    yScrew
);


/* =========================================================
   X CARRIAGE
   ========================================================= */

const carriage =
    new THREE.Group();

gantry.add(
    carriage
);


addBox(
    carriage,
    34,
    38,
    30,
    aluminumDark,
    0,
    69,
    -34
);


addBox(
    carriage,
    28,
    26,
    34,
    aluminum,
    0,
    54,
    -34
);


/* =========================================================
   X RAILS
   ========================================================= */

for (
    const y of [62, 77]
) {

    const rail =
        cylinder(
            2.5,
            105,
            steel
        );

    rail.rotation.z =
        Math.PI / 2;

    rail.position.set(
        0,
        y,
        -45
    );

    gantry.add(
        rail
    );

}


/* =========================================================
   X BALL SCREW
   ========================================================= */

const xScrew =
    cylinder(
        2.1,
        110,
        steel
    );

xScrew.rotation.z =
    Math.PI / 2;

xScrew.position.set(
    0,
    72,
    -48
);

gantry.add(
    xScrew
);


/* =========================================================
   Z AXIS
   ========================================================= */

const zAxis =
    new THREE.Group();

carriage.add(
    zAxis
);


addBox(
    zAxis,
    24,
    48,
    25,
    black,
    0,
    32,
    -34
);


/* =========================================================
   Z GUIDE RODS
   ========================================================= */

for (
    const x of [-7, 7]
) {

    const rod =
        cylinder(
            2.3,
            42,
            steel
        );

    rod.position.set(
        x,
        30,
        -48
    );

    zAxis.add(
        rod
    );

}


/* =========================================================
   Z BALL SCREW
   ========================================================= */

const zScrew =
    cylinder(
        2.1,
        48,
        steel
    );

zScrew.position.set(
    0,
    30,
    -49
);

zAxis.add(
    zScrew
);


/* =========================================================
   SPINDLE
   ========================================================= */

const spindle =
    new THREE.Group();

zAxis.add(
    spindle
);


const spindleBody =
    cylinder(
        8,
        32,
        black
    );

spindleBody.position.set(
    0,
    17,
    -35
);

spindle.add(
    spindleBody
);


const spindleTop =
    cylinder(
        9,
        8,
        aluminum
    );

spindleTop.position.set(
    0,
    34,
    -35
);

spindle.add(
    spindleTop
);


const spindleBottom =
    cylinder(
        5.5,
        8,
        steel
    );

spindleBottom.position.set(
    0,
    0,
    -35
);

spindle.add(
    spindleBottom
);


/* =========================================================
   SPINDLE COOLING FINS
   ========================================================= */

for (
    let y = 8;
    y <= 28;
    y += 4
) {

    addBox(
        spindle,
        18,
        1.5,
        20,
        aluminum,
        0,
        y,
        -35
    );

}


/* =========================================================
   COLLET
   ========================================================= */

const collet =
    cylinder(
        3.5,
        7,
        steel
    );

collet.position.set(
    0,
    -7,
    -35
);

spindle.add(
    collet
);


/* =========================================================
   CUTTING TOOL
   ========================================================= */

const cutter =
    cylinder(
        1.4,
        18,
        steel
    );

cutter.position.set(
    0,
    -18,
    -35
);

spindle.add(
    cutter
);


/* =========================================================
   TOOL TIP
   ========================================================= */

const toolTip =
    cylinder(
        1.8,
        3,
        yellow
    );

toolTip.position.set(
    0,
    -28,
    -35
);

spindle.add(
    toolTip
);


/* =========================================================
   SPINDLE MOTOR
   ========================================================= */

const spindleMotor =
    cylinder(
        10,
        8,
        aluminum
    );

spindleMotor.position.set(
    0,
    40,
    -35
);

spindle.add(
    spindleMotor
);


/* =========================================================
   CABLE CHAIN
   ========================================================= */

const cableChain =
    new THREE.Group();

cnc.add(
    cableChain
);


for (
    let i = 0;
    i < 14;
    i++
) {

    const link =
        addBox(
            cableChain,
            6,
            3,
            9,
            black,
            -48 + i * 7,
            87,
            -54
        );

    link.rotation.y =
        (i % 2 === 0)
        ? 0.04

function motor(
    x,
    y,
    z,
    rotationX = 0,
    rotationY = 0,
    rotationZ = 0
) {

    const group =
        new THREE.Group();

    group.position.set(
        x,
        y,
        z
    );

    group.rotation.set(
        rotationX,
        rotationY,
        rotationZ
    );

    const body =
        cylinder(
            8,
            12,
            black
        );

    body.rotation.z =
        Math.PI / 2;

    group.add(
        body
    );


    const cap =
        cylinder(
            5,
            2,
            aluminumLight
        );

    cap.rotation.z =
        Math.PI / 2;

    cap.position.x =
        7;

    group.add(
        cap
    );


    cnc.add(
        group
    );

    return group;

}

/* =========================================================
   SIMULATION STATE
   ========================================================= */

const state = {

    running:
        false,

    paused:
        false,

    stopped:
        false,

    time:
        0,

    speed:
        1

};


/* =========================================================
   HUD
   ========================================================= */

function updateHUD(
    x,
    y,
    z
) {

    document
        .getElementById("x")
        .textContent =
        x.toFixed(2);

    document
        .getElementById("y")
        .textContent =
        y.toFixed(2);

    document
        .getElementById("z")
        .textContent =
        z.toFixed(2);

}


function setStatus(
    text
) {

    document
        .getElementById("statusText")
        .textContent =
        text;

}


/* =========================================================
   RECORD TOOLPATH
   ========================================================= */

const worldToolPosition =
    new THREE.Vector3();


function recordToolPath() {

    toolTip.getWorldPosition(
        worldToolPosition
    );

    toolPathPoints.push(
        worldToolPosition.clone()
    );

    if (
        toolPathPoints.length >
        1500
    ) {

        toolPathPoints.shift();

    }

    pathGeometry.setFromPoints(
        toolPathPoints
    );

}


/* =========================================================
   SIMULATION
   ========================================================= */

function simulate(
    delta
) {

    if (
        !state.running ||
        state.paused ||
        state.stopped
    ) {

        return;

    }


    state.time +=
        delta *
        state.speed;


    /*
       X
    */

    const x =
        Math.sin(
            state.time * 0.8
        ) * 42;


    /*
       Y
    */

    const y =
        Math.sin(
            state.time * 0.48
        ) * 25;


    /*
       Z
    */

    const z =
        5 +
        Math.max(
            0,
            Math.sin(
                state.time * 1.15
            )
        ) * 10;


    /*
       X movement
    */

    carriage.position.x =
        x;


    /*
       Y movement

       El gantry se desplaza
       en profundidad.
    */

    gantry.position.z =
        y;


    /*
       Z movement
    */

    zAxis.position.y =
        -z;


    /*
       Spindle rotation
    */

    spindle.rotation.y +=
        0.35 *
        state.speed;


    updateHUD(
        x,
        y,
        z
    );


    recordToolPath();


    if (
        state.time >
        Math.PI * 10
    ) {

        state.running =
            false;

        setStatus(
            "COMPLETED"
        );

    }

}


/* =========================================================
   BUTTONS
   ========================================================= */

document

    .onclick = () => {

        state.paused =
            false;

        state.stopped =

        );

    };


document
    .getElementById("pause")
    .onclick = () => {

        if (
            state.running
        ) {

            state.paused =
                true;

            setStatus(
                "PAUSED"
            );

        }

    };


document
    .getElementById("stop")
    .onclick = () => {

        state.running =
            false;

        state.paused =
            false;

        state.stopped =
            true;

        setStatus(
            "STOPPED"
        );

    };


document
    .getElementById("home")
    .onclick = () => {

        state.running =
            false;

        state.paused =
            false;

        state.stopped =
            false;

        state.time =
            0;

        carriage.position.x =
            0;

        gantry.position.z =
            0;

        zAxis.position.y =
            0;

        spindle.rotation.y =
            0;

        toolPathPoints.length =
            0;

        pathGeometry.setFromPoints(
            []
        );

        updateHUD(
            0,
            0,
            0
        );

        setStatus(
            "READY"
        );

    };


document
    .getElementById("speed")
    .oninput =
    event => {

        state.speed =
            parseFloat(
                event.target.value
            );

    };


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   ANIMATION
   ========================================================= */

let previousTime =
    performance.now();


function animate(
    currentTime
) {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(

            (
                currentTime -
                previousTime
            ) / 1000,

            0.05

        );


    previousTime =
        currentTime;


    simulate(
        delta
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate(
    performance.now()
);
