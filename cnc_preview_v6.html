<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PyCNC Studio V6</title>

<style>

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

}

canvas {

    display: block;

}

#info {

    position: fixed;

    top: 15px;
    left: 15px;

    padding: 10px 14px;

    color: #fff;

    background: rgba(0,0,0,0.65);

    font-family:
        Arial,
        sans-serif;

    font-size: 14px;

    z-index: 10;

    border: 1px solid #444;

}

</style>

</head>


<body>

<div id="info">
    PyCNC Studio V6 — Machine Test
</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE
    from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls }
    from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

import {
    box,
    addBox,
    cylinder
}
from "./js/modules/utils.js";

import {
    aluminum,
    aluminumDark,
    aluminumLight,
    black,
    steel,
    yellow,
    workMaterial
}
from "./js/modules/materials.js";

import {
    buildMachine
}
from "./js/modules/machine_v6.js";


/*
============================================================
SCENE
============================================================
*/

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x15191c
    );


/*
============================================================
CAMERA
============================================================
*/

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        1,
        5000
    );

camera.position.set(
    350,
    300,
    450
);


/*
============================================================
RENDERER
============================================================
*/

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.shadowMap.enabled =
    true;

document.body.appendChild(
    renderer.domElement
);


/*
============================================================
LIGHTS
============================================================
*/

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x222222,
        2
    );

scene.add(
    ambient
);


const directional =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

directional.position.set(
    300,
    500,
    300
);

directional.castShadow =
    true;

scene.add(
    directional
);


/*
============================================================
CNC ROOT
============================================================
*/

const cnc =
    new THREE.Group();

scene.add(
    cnc
);


/*
============================================================
Z AXIS
============================================================
*/

const zAxis =
    new THREE.Group();

cnc.add(
    zAxis
);


/*
============================================================
MACHINE CONFIGURATION
============================================================
*/

const WORK_AREA = {

    X: 110,
    Y: 70,
    Z: 70

};


const LIMITS = {

    X_MIN: 0,
    X_MAX: WORK_AREA.X,

    Y_MIN: 0,
    Y_MAX: WORK_AREA.Y,

    Z_MIN: -100,
    Z_MAX: WORK_AREA.Z

};


const MACHINE = {

    tableX:
        WORK_AREA.X,

    tableY:
        WORK_AREA.Y,

    tableThickness:
        40,

    frameHeight:
        850,

    columnSize:
        70,

    gantryThickness:
        70,

    gantryDepth:
        100,

    spindleWidth:
        90,

    spindleDepth:
        90,

    toolLength:
        120

};


/*
============================================================
BUILD MACHINE
============================================================
*/

let machine;

try {

    machine =
        buildMachine({

            scene,

            cnc,

            zAxis,

            MACHINE,

            LIMITS,

            WORK_AREA,

            materials: {

                aluminum,
                aluminumDark,
                aluminumLight,
                black,
                steel,
                yellow,
                workMaterial

            },

            box,
            addBox,
            cylinder

        });


    // Exponer máquina para depuración desde DevTools
    window.pycncMachine = machine;
    console.log(
        "PyCNC Studio V6 — machine:",
        machine
    );


    document.getElementById(
        "info"
    ).textContent =
        "PyCNC Studio V6 — MACHINE OK";


}
catch (error) {

    console.error(
        "ERROR construyendo máquina:",
        error
    );

    document.getElementById(
        "info"
    ).textContent =
        "ERROR — revisar consola";

}


/*
============================================================
GRID
============================================================
*/

const grid =
    new THREE.GridHelper(
        500,
        50
    );

scene.add(
    grid
);


/*
============================================================
ORBIT CONTROLS
============================================================
*/

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.target.set(
    0,
    0,
    0
);

controls.enableDamping =
    true;


/*
============================================================
RESIZE
============================================================
*/

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/*
============================================================
ANIMATION
============================================================
*/

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>

</html>
